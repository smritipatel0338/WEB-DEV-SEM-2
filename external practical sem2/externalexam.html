<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Even or Odd Checker</title>
  <!-- Link external CSS -->
  <link rel="stylesheet" href="externalexam.css">
</head>
<body>
  <div class="container">
    <h1>Even or Odd Number Checker</h1>
    
    <!-- Input form -->
    <form id="numberForm">
      <label for="numberInput">Enter a number:</label>
      <input type="number" id="numberInput" placeholder="Type a number here">
      <button type="submit">Check</button>
    </form>
    
    <!-- Result display -->
    <div id="result"></div>
  </div>

  <!-- Link external JS -->
  <script src="externalexam.js"></script>
</body>
</html>
